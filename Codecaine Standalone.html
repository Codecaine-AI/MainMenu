document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 font-family: 'Roboto Condensed';\n  font-style: italic;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b545d73b-7a78-463a-8aa0-4d2bd27d67b6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Roboto Condensed';\n  font-style: italic;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9f75d2be-9952-4cb6-8153-92d9db580c06\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    /*EDITMODE-BEGIN*/\n    --tweaks: 0;\n    /*EDITMODE-END*/\n    --amber: #f6c419;\n    --amber-deep: #b8860b;\n    --amber-glow: #ffe066;\n    --ink: #0a0820;\n    --ink-2: #120a2e;\n    --ink-3: #1a0f3d;\n    --cyan: #7fd8ff;\n    --magenta: #e8539e;\n    --chrome: #d8c77a;\n    --hint-bg: #f4ecd3;\n    --hint-ink: #1a0f3d;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { height: 100%; overflow: hidden; background: #000; color: #eee; font-family: 'JetBrains Mono', ui-monospace, monospace; }\n\n  /* ---- Fixed 1440x1080 (4:3) stage, scaled to viewport ---- */\n  #stage-wrap { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }\n  #stage {\n    position: relative;\n    width: 1440px;\n    height: 1080px;\n    transform-origin: center center;\n    overflow: hidden;\n    background: #000;\n  }\n\n  /* ---- Vortex / grid tunnel background ---- */\n  .vortex {\n    position: absolute; inset: -10%;\n    background:\n      radial-gradient(ellipse at center, rgba(40,20,90,0.0) 0%, rgba(10,8,32,0.7) 60%, #000 100%);\n    z-index: 0;\n    pointer-events: none;\n  }\n  .vortex .ring {\n    position: absolute; inset: 0;\n    background-image:\n      repeating-conic-gradient(from 0deg,\n        rgba(255, 200, 60, 0.0) 0deg 2deg,\n        rgba(255, 200, 60, 0.06) 2deg 3deg,\n        rgba(255, 200, 60, 0.0) 3deg 6deg),\n      repeating-radial-gradient(circle at 50% 50%,\n        rgba(180, 120, 255, 0.12) 0 2px,\n        transparent 2px 60px);\n    mix-blend-mode: screen;\n    animation: spin 90s linear infinite;\n  }\n  .vortex .ring.r2 {\n    animation-duration: 140s;\n    animation-direction: reverse;\n    opacity: .5;\n    filter: hue-rotate(40deg);\n  }\n  .vortex .haze {\n    position: absolute; inset: 0;\n    background:\n      radial-gradient(circle at 30% 40%, rgba(120, 60, 200, 0.35), transparent 50%),\n      radial-gradient(circle at 70% 60%, rgba(200, 100, 40, 0.25), transparent 55%),\n      radial-gradient(circle at 50% 50%, rgba(30, 14, 70, 0.6), transparent 70%);\n    mix-blend-mode: screen;\n  }\n  @keyframes spin { to { transform: rotate(360deg); } }\n\n  /* ---- CRT overlay ---- */\n  .crt {\n    position: absolute; inset: 0; z-index: 90; pointer-events: none;\n  }\n  .crt .scan {\n    position: absolute; inset: 0;\n    background: repeating-linear-gradient(to bottom,\n      rgba(0,0,0,0) 0px,\n      rgba(0,0,0,0) 2px,\n      rgba(0,0,0,0.25) 3px,\n      rgba(0,0,0,0) 4px);\n    mix-blend-mode: multiply;\n  }\n  .crt .vign {\n    position: absolute; inset: 0;\n    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);\n  }\n  .crt .rgb {\n    position: absolute; inset: 0;\n    background:\n      linear-gradient(to right, rgba(255,50,80,.04), transparent 8%, transparent 92%, rgba(80,200,255,.04));\n    mix-blend-mode: screen;\n  }\n  .crt.off { display: none; }\n\n  /* ---- Chromatic aberration on key elements ---- */\n  .chroma { text-shadow: 1.5px 0 0 rgba(255, 60, 90, 0.55), -1.5px 0 0 rgba(80, 200, 255, 0.55); }\n\n  /* shared chunky italic display font */\n  .ital-display {\n    font-family: 'Saira Condensed', 'Roboto Condensed', system-ui, sans-serif;\n    font-style: italic;\n    font-weight: 800;\n    letter-spacing: 0.01em;\n  }\n\n  /* ---- Screen router ---- */\n  .screen { position: absolute; inset: 0; z-index: 10; display: none; }\n  .screen.active { display: block; }\n\n  /* ============================================\n     TITLE SCREEN\n     ============================================ */\n  #title-screen { display: grid; place-items: center; text-align: center; }\n  #title-screen.active { display: grid; }\n  .title-logo {\n    font-family: 'Orbitron', sans-serif;\n    font-weight: 900;\n    font-size: 280px;\n    letter-spacing: 0.04em;\n    line-height: 0.9;\n    color: transparent;\n    background: linear-gradient(180deg, #fff9e0 0%, #f6c419 40%, #8a5a00 75%, #f4e3a3 100%);\n    -webkit-background-clip: text; background-clip: text;\n    filter: drop-shadow(0 0 30px rgba(246, 196, 25, 0.45)) drop-shadow(0 6px 0 #3a2200);\n    text-shadow: 0 0 80px rgba(255, 220, 120, 0.3);\n    position: relative;\n  }\n  .title-sub {\n    font-family: 'Orbitron', sans-serif;\n    font-weight: 500;\n    font-size: 110px;\n    letter-spacing: 0.1em;\n    color: #fff;\n    text-shadow: 0 0 20px rgba(255,255,255,0.6), 0 4px 0 rgba(0,0,0,0.7);\n    margin-top: -10px;\n  }\n  .title-press {\n    margin-top: 80px;\n    font-family: 'Orbitron', sans-serif;\n    font-weight: 700;\n    font-size: 56px;\n    letter-spacing: 0.25em;\n    color: var(--amber);\n    text-shadow: 0 0 20px rgba(246, 196, 25, 0.7), 0 3px 0 #3a2200;\n    animation: blink 1.1s steps(2, end) infinite;\n  }\n  @keyframes blink { 50% { opacity: 0.15; } }\n  .title-copyright {\n    position: absolute; bottom: 60px; left: 0; right: 0; text-align: center;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 18px; color: #ddd; letter-spacing: 0.05em; line-height: 1.6;\n    opacity: 0.85;\n  }\n  .title-tm { font-size: 0.35em; vertical-align: super; margin-left: 6px; color: #fff; }\n\n  /* ============================================\n     MENU SCREEN (shared chrome)\n     ============================================ */\n  .menu-shell {\n    position: absolute; inset: 0;\n    padding: 70px 90px 60px;\n    display: grid; grid-template-rows: auto 1fr auto; gap: 0;\n  }\n\n  /* Top header bar — sits ON the top border of the frame */\n  .header-bar {\n    position: relative;\n    display: flex; align-items: flex-end; gap: 0;\n    height: 76px;\n    padding-left: 50px;\n    /* drop a little so the header sits on top of the frame's top border */\n    margin-bottom: -16px;\n    z-index: 5;\n  }\n  .crumb {\n    font-family: 'Saira Condensed', 'Roboto Condensed', sans-serif;\n    font-style: italic; font-weight: 800;\n    font-size: 56px; letter-spacing: 0.01em;\n    color: transparent;\n    -webkit-text-stroke: 2px #f6c419;\n    text-shadow:\n      0 0 12px rgba(246,196,25,0.5),\n      3px 3px 0 rgba(0,0,0,0.6);\n    padding: 0 24px 0 14px;\n    line-height: 1;\n    /* sit the text above the line and let bg cut through the border */\n    background: var(--ink-2);\n    box-shadow: 0 0 30px 8px var(--ink-2);\n    position: relative;\n  }\n  .crumb.fill {\n    color: #f6c419;\n    -webkit-text-stroke: 0;\n  }\n  /* The 3 amber pipe slits next to the header */\n  .header-slits {\n    display: flex; flex-direction: column; gap: 4px;\n    margin-left: 0px;\n    margin-bottom: 14px;\n    padding-left: 14px;\n    background: var(--ink-2);\n    box-shadow: 0 0 24px 8px var(--ink-2);\n    position: relative;\n  }\n  .header-slits .slit {\n    height: 4px; width: 100px;\n    background: #f6c419;\n    box-shadow: 0 0 6px rgba(246,196,25,0.6);\n  }\n  .header-slits .slit:nth-child(1) { width: 70px; }\n  .header-slits .slit:nth-child(2) { width: 100px; }\n  .header-slits .slit:nth-child(3) { width: 60px; }\n  /* Old header-line removed */\n  .header-line { display: none; }\n  .crumb-sep { display: none; }\n  .ns-divider {\n    position: relative;\n    display: grid; place-items: center;\n  }\n  .ns-divider .tick-row {\n    position: absolute; top: 30px; bottom: 30px; left: 50%; transform: translateX(-50%);\n    width: 4px;\n    background-image: repeating-linear-gradient(to bottom,\n      rgba(246,196,25,0.55) 0 4px, transparent 4px 14px);\n  }\n  .ns-label {\n    writing-mode: vertical-rl; transform: rotate(180deg);\n    font-family: 'Saira Condensed', 'Roboto Condensed', sans-serif;\n    font-style: italic; font-weight: 800;\n    letter-spacing: 0.45em; font-size: 18px;\n    color: rgba(246,196,25,0.85);\n    text-shadow: 0 0 8px rgba(246,196,25,0.5);\n    background: transparent;\n    padding: 30px 4px;\n    z-index: 2;\n  }\n\n  /* Main menu frame — beveled, raised chrome */\n  .menu-frame {\n    position: relative;\n    border-radius: 32px 60px 32px 60px / 32px 60px 32px 60px;\n    background:\n      linear-gradient(180deg, rgba(10, 8, 32, 0.55), rgba(20, 10, 50, 0.45)),\n      radial-gradient(ellipse at 30% 20%, rgba(246, 196, 25, 0.06), transparent 50%);\n    box-shadow:\n      0 30px 80px rgba(0,0,0,0.8),\n      0 0 0 2px rgba(0,0,0,0.9),\n      0 0 0 5px rgba(246, 196, 25, 0.85),\n      0 0 0 6px rgba(255, 240, 160, 0.4),\n      0 0 0 9px rgba(0,0,0,0.75),\n      0 0 0 11px rgba(246, 196, 25, 0.22),\n      inset 0 0 60px rgba(246, 196, 25, 0.06),\n      inset 0 2px 0 rgba(255, 220, 120, 0.18);\n    display: grid;\n    grid-template-columns: 1fr 56px 500px;\n    overflow: visible;\n    perspective: 1600px;\n  }\n  .menu-frame::before {\n    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.22;\n    background:\n      linear-gradient(rgba(127, 216, 255, 0.55) 1px, transparent 1px) 0 0/ 60px 60px,\n      linear-gradient(90deg, rgba(127, 216, 255, 0.55) 1px, transparent 1px) 0 0/ 60px 60px;\n    mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);\n    border-radius: inherit;\n  }\n  .menu-frame::after {\n    /* inner thin tick outline */\n    content: ''; position: absolute; inset: 16px; pointer-events: none;\n    border: 1px solid rgba(246, 196, 25, 0.25);\n    border-radius: 24px 52px 24px 52px / 24px 52px 24px 52px;\n  }\n\n  .menu-list {\n    position: relative; z-index: 2;\n    padding: 50px 20px 50px 80px;\n    display: flex; flex-direction: column; gap: 14px;\n    justify-content: center;\n    align-items: flex-start;\n  }\n  /* Each pill is auto-width, with hand-placed left/right padding for variable widths */\n  .menu-list .pill { width: auto; }\n  .menu-list .pill:nth-child(1) { padding-right: 90px;  margin-left:  10px; }\n  .menu-list .pill:nth-child(2) { padding-right: 130px; margin-left: 30px; }\n  .menu-list .pill:nth-child(3) { padding-right: 110px; margin-left:  0px; }\n  .menu-list .pill:nth-child(4) { padding-right: 150px; margin-left: 24px; }\n  .menu-list .pill:nth-child(5) { padding-right: 100px; margin-left: 12px; }\n\n  /* Pill button */\n  .pill {\n    position: relative;\n    height: 76px;\n    padding: 0 60px 0 36px;\n    display: inline-flex; align-items: center;\n    font-family: 'Saira Condensed', 'Roboto Condensed', sans-serif;\n    font-style: italic; font-weight: 800;\n    font-size: 50px;\n    letter-spacing: 0.005em;\n    color: #f8e79a;\n    background: linear-gradient(180deg, rgba(35, 18, 6, 0.9) 0%, rgba(15, 8, 4, 0.95) 100%);\n    border: 3px solid #f6c419;\n    border-radius: 999px;\n    box-shadow:\n      inset 0 2px 0 rgba(255, 220, 120, 0.22),\n      inset 0 -2px 0 rgba(0,0,0,0.5),\n      0 4px 0 rgba(0,0,0,0.55);\n    cursor: pointer;\n    transition: padding-left .15s ease, transform .15s ease, filter .12s ease;\n    user-select: none;\n  }\n  .pill:hover { filter: brightness(1.15); }\n  .pill .pill-tip {\n    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);\n    width: 28px; height: 28px; border-radius: 999px;\n    background: radial-gradient(circle at 30% 30%, #ffe066, #b8860b 60%, #3a2200 100%);\n    box-shadow: 0 0 8px rgba(246, 196, 25, 0.5);\n  }\n\n  .pill.selected {\n    color: #1a0a00;\n    background: linear-gradient(180deg, #fff4a8 0%, #f6c419 50%, #b8860b 100%);\n    border-color: #fff4b0;\n    padding-left: 90px;\n    box-shadow:\n      inset 0 3px 0 rgba(255,255,255,0.55),\n      inset 0 -3px 0 rgba(120, 70, 0, 0.5),\n      0 0 40px rgba(246, 196, 25, 0.45),\n      0 4px 0 rgba(0,0,0,0.55);\n    text-shadow: 0 1px 0 rgba(255,255,255,0.35);\n    transform: translateX(-30px);\n    z-index: 3;\n  }\n  /* Yellow arrow tab on the LEFT of selected pill */\n  .pill.selected::before {\n    content: '';\n    position: absolute; left: -50px; top: 50%;\n    width: 92px; height: 70px;\n    transform: translateY(-50%);\n    background: linear-gradient(180deg, #fff4a8 0%, #f6c419 50%, #b8860b 100%);\n    clip-path: polygon(0% 50%, 30% 0%, 100% 0%, 100% 100%, 30% 100%);\n    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5));\n    z-index: -1;\n  }\n  .pill.selected .pill-tip {\n    width: 38px; height: 38px;\n    background: radial-gradient(circle at 35% 35%, #eaff99, #8adf3a 40%, #2a5a00 90%);\n    box-shadow: 0 0 24px rgba(150, 255, 80, 0.9), inset 0 0 8px rgba(255,255,255,0.6);\n    right: 10px;\n    animation: orb-pulse 1.4s ease-in-out infinite;\n    z-index: 4;\n  }\n  @keyframes orb-pulse {\n    0%, 100% { box-shadow: 0 0 24px rgba(150, 255, 80, 0.9), inset 0 0 8px rgba(255,255,255,0.6); }\n    50%      { box-shadow: 0 0 40px rgba(180, 255, 120, 1), inset 0 0 12px rgba(255,255,255,0.9); }\n  }\n\n  /* Preview panel — small, tilted in 3D perspective */\n  .preview {\n    position: relative; z-index: 2;\n    margin: 70px 40px 70px 0;\n    border: 2px solid rgba(246, 196, 25, 0.55);\n    border-radius: 14px;\n    background: linear-gradient(180deg, rgba(8, 6, 28, 0.85), rgba(12, 8, 40, 0.75));\n    padding: 30px 24px 24px;\n    display: flex; flex-direction: column; gap: 12px;\n    overflow: hidden;\n    transform: rotateY(-22deg) rotateX(3deg) translateZ(-30px);\n    transform-origin: left center;\n    box-shadow:\n      -20px 14px 40px rgba(0,0,0,0.55),\n      inset 0 0 40px rgba(127,216,255,0.05),\n      inset 0 2px 0 rgba(255,220,120,0.2);\n  }\n  .preview::before {\n    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.25;\n    background:\n      linear-gradient(rgba(127, 216, 255, 0.4) 1px, transparent 1px) 0 0/ 40px 40px,\n      linear-gradient(90deg, rgba(127, 216, 255, 0.4) 1px, transparent 1px) 0 0/ 40px 40px;\n    mask-image: linear-gradient(180deg, black 20%, transparent 95%);\n  }\n  .preview-label { display: none; }\n  .preview-title { display: none; }\n  .preview-sub { display: none; }\n  .preview-list {\n    list-style: none; display: flex; flex-direction: column; gap: 14px;\n    font-family: 'Saira Condensed', 'Roboto Condensed', sans-serif;\n    font-style: italic; font-weight: 700;\n    font-size: 30px; color: #f4ecd3;\n    position: relative; z-index: 2;\n    text-shadow: 1px 1px 0 rgba(0,0,0,0.6);\n  }\n  .preview-list li { padding-left: 0; position: relative; letter-spacing: 0.01em; }\n  .preview-list li::before {\n    display: none;\n    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);\n    width: 8px; height: 8px; background: var(--amber); border-radius: 2px;\n    box-shadow: 0 0 8px rgba(246,196,25,0.7);\n  }\n  .preview-art {\n    flex: 1; position: relative; z-index: 2;\n    border: 1px solid rgba(127, 216, 255, 0.25);\n    background:\n      repeating-linear-gradient(135deg, rgba(127,216,255,0.04) 0 20px, rgba(127,216,255,0.0) 20px 40px),\n      linear-gradient(180deg, rgba(20,10,50,0.6), rgba(5,3,20,0.9));\n    border-radius: 10px;\n    display: grid; place-items: center;\n    min-height: 200px;\n    color: rgba(127,216,255,0.55);\n    font-size: 18px; letter-spacing: 0.2em;\n  }\n\n  /* Bottom description box — inline with the frame style */\n  .hint-bar {\n    height: 80px;\n    background: linear-gradient(180deg, rgba(20, 12, 50, 0.9), rgba(10, 6, 28, 0.95));\n    border: 3px solid #f6c419;\n    border-radius: 14px;\n    box-shadow:\n      0 4px 0 rgba(0,0,0,0.55),\n      inset 0 2px 0 rgba(255,220,120,0.18);\n    display: flex; align-items: center; padding: 0 36px;\n    font-family: 'Saira Condensed', 'Roboto Condensed', sans-serif;\n    font-style: italic; font-weight: 700;\n    font-size: 36px;\n    color: #f4ecd3;\n    letter-spacing: 0.01em;\n    position: relative;\n    text-shadow: 1px 1px 0 rgba(0,0,0,0.6);\n    margin-top: 28px;\n  }\n  .hint-bar .hint-tag { display: none; }\n\n  /* ============================================\n     PROJECTS DETAIL SCREEN\n     ============================================ */\n  .projects-grid {\n    padding: 40px 50px;\n    position: relative; z-index: 2;\n    display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px;\n    align-content: start;\n    height: 100%;\n    overflow: hidden;\n  }\n  .project-card {\n    position: relative;\n    background: linear-gradient(180deg, rgba(15,10,40,0.9), rgba(8,5,24,0.95));\n    border: 2px solid rgba(246, 196, 25, 0.4);\n    border-radius: 14px;\n    padding: 24px;\n    cursor: pointer;\n    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;\n    display: flex; flex-direction: column; gap: 14px;\n    min-height: 240px;\n  }\n  .project-card.selected {\n    border-color: var(--amber);\n    box-shadow: 0 0 40px rgba(246,196,25,0.4), inset 0 0 0 2px rgba(255,220,120,0.4);\n    transform: translateY(-4px);\n  }\n  .project-thumb {\n    height: 120px; border-radius: 8px;\n    background:\n      repeating-linear-gradient(45deg, rgba(246,196,25,0.1) 0 8px, transparent 8px 16px),\n      linear-gradient(135deg, #2a1a60, #140a3a);\n    border: 1px solid rgba(246,196,25,0.25);\n    display: grid; place-items: center;\n    color: rgba(246,196,25,0.6);\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 14px; letter-spacing: 0.15em;\n  }\n  .project-title {\n    font-family: 'Orbitron', sans-serif; font-weight: 700;\n    font-size: 26px; color: #f8e79a; letter-spacing: 0.02em;\n  }\n  .project-meta {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 14px; color: #9aa4c0; letter-spacing: 0.05em;\n  }\n  .project-tags {\n    display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto;\n  }\n  .project-tag {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 12px; letter-spacing: 0.1em;\n    padding: 3px 10px;\n    background: rgba(127, 216, 255, 0.12);\n    border: 1px solid rgba(127, 216, 255, 0.35);\n    color: var(--cyan);\n    border-radius: 999px;\n  }\n\n  /* Simple stub screens */\n  .stub {\n    padding: 60px; position: relative; z-index: 2;\n    display: flex; flex-direction: column; gap: 24px;\n    font-family: 'Orbitron', sans-serif;\n  }\n  .stub h2 { font-size: 60px; color: #fff; letter-spacing: 0.04em; }\n  .stub p { font-family: 'JetBrains Mono', monospace; font-size: 22px; line-height: 1.7; color: #cfd6e8; max-width: 900px; }\n\n  .testimonial-card {\n    border-left: 3px solid var(--amber);\n    padding: 16px 28px; margin-bottom: 18px;\n    background: rgba(10,8,32,0.5);\n    border-radius: 0 10px 10px 0;\n  }\n  .testimonial-card .q { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #e8e2d0; line-height: 1.6; }\n  .testimonial-card .a { font-family: 'Orbitron', sans-serif; margin-top: 10px; font-size: 18px; color: var(--amber); letter-spacing: 0.08em; }\n\n  .link-row {\n    display: grid; grid-template-columns: 200px 1fr auto; gap: 24px; align-items: center;\n    padding: 18px 28px;\n    border: 1px solid rgba(246,196,25,0.3);\n    border-radius: 10px;\n    margin-bottom: 14px;\n    background: rgba(10,8,32,0.5);\n    cursor: pointer;\n    transition: background .15s, border-color .15s;\n  }\n  .link-row:hover, .link-row.selected { background: rgba(246,196,25,0.08); border-color: var(--amber); }\n  .link-row .label { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 26px; color: #f8e79a; letter-spacing: 0.05em; }\n  .link-row .url { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #9aa4c0; }\n  .link-row .arrow { font-family: 'Orbitron', sans-serif; color: var(--amber); font-size: 30px; }\n\n  /* ============================================\n     TWEAKS PANEL\n     ============================================ */\n  #tweaks-panel {\n    position: fixed; bottom: 20px; right: 20px;\n    z-index: 1000;\n    width: 320px;\n    background: rgba(10, 8, 32, 0.96);\n    border: 2px solid rgba(246, 196, 25, 0.6);\n    border-radius: 12px;\n    padding: 18px;\n    font-family: 'JetBrains Mono', monospace;\n    color: #f8e79a;\n    display: none;\n    backdrop-filter: blur(6px);\n    box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 30px rgba(246,196,25,0.2);\n  }\n  #tweaks-panel.on { display: block; }\n  #tweaks-panel h3 {\n    font-family: 'Orbitron', sans-serif; font-size: 16px; letter-spacing: 0.25em;\n    color: var(--amber); margin-bottom: 14px;\n  }\n  #tweaks-panel .tweak { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; font-size: 13px; gap: 12px; }\n  #tweaks-panel select, #tweaks-panel input[type=range] {\n    background: #0a0820; color: #f8e79a; border: 1px solid rgba(246,196,25,0.4); border-radius: 4px; padding: 3px 6px;\n    font-family: inherit; font-size: 12px;\n  }\n  #tweaks-panel input[type=checkbox] { accent-color: var(--amber); width: 16px; height: 16px; }\n\n  /* Fade in on screen change */\n  .screen { opacity: 0; transition: opacity .3s ease; }\n  .screen.active { opacity: 1; }\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"stage-wrap\">\n  <div id=\"stage\">\n\n    <!-- Vortex background -->\n    <div class=\"vortex\">\n      <div class=\"ring\"><\u002Fdiv>\n      <div class=\"ring r2\"><\u002Fdiv>\n      <div class=\"haze\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Screens mount here -->\n    <div id=\"screens\"><\u002Fdiv>\n\n    <!-- CRT overlay -->\n    <div class=\"crt\" id=\"crt\">\n      <div class=\"scan\"><\u002Fdiv>\n      <div class=\"rgb\"><\u002Fdiv>\n      <div class=\"vign\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"tweaks-panel\">\n  <h3>TWEAKS<\u002Fh3>\n  <div class=\"tweak\"><label>CRT scanlines<\u002Flabel><input type=\"checkbox\" id=\"tw-crt\" checked=\"\"><\u002Fdiv>\n  <div class=\"tweak\"><label>Menu audio<\u002Flabel><input type=\"checkbox\" id=\"tw-audio\"><\u002Fdiv>\n  <div class=\"tweak\"><label>Vortex speed<\u002Flabel><input type=\"range\" id=\"tw-speed\" min=\"0\" max=\"2\" step=\"0.1\" value=\"1\"><\u002Fdiv>\n  <div class=\"tweak\"><label>Accent hue<\u002Flabel><input type=\"range\" id=\"tw-hue\" min=\"0\" max=\"360\" step=\"1\" value=\"48\"><\u002Fdiv>\n  <div class=\"tweak\"><label>Font family<\u002Flabel>\n    <select id=\"tw-font\">\n      <option value=\"orbitron\">Orbitron<\u002Foption>\n      <option value=\"michroma\">Michroma<\u002Foption>\n      <option value=\"mono\">JetBrains Mono<\u002Foption>\n    <\u002Fselect>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* ==========================================================\n   Stage scaler — lock content to 1440x1080 (4:3), fit viewport\n   ========================================================== */\nfunction fitStage() {\n  const stage = document.getElementById('stage');\n  const wrap = document.getElementById('stage-wrap');\n  const sw = wrap.clientWidth, sh = wrap.clientHeight;\n  const s = Math.min(sw / 1440, sh / 1080);\n  stage.style.transform = `scale(${s})`;\n}\nwindow.addEventListener('resize', fitStage);\nfitStage();\n\n/* ==========================================================\n   Audio blips (WebAudio) — toggleable\n   ========================================================== */\nconst Audio = (() => {\n  let ctx = null, enabled = false;\n  function ensure() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); }\n  function blip(freq = 520, dur = 0.06, type = 'square', gain = 0.06) {\n    if (!enabled) return;\n    ensure();\n    if (ctx.state === 'suspended') ctx.resume();\n    const o = ctx.createOscillator(); const g = ctx.createGain();\n    o.type = type; o.frequency.value = freq;\n    g.gain.setValueAtTime(gain, ctx.currentTime);\n    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);\n    o.connect(g); g.connect(ctx.destination);\n    o.start(); o.stop(ctx.currentTime + dur);\n  }\n  return {\n    set: v => { enabled = v; },\n    move: () => blip(620, 0.05, 'square', 0.04),\n    select: () => { blip(880, 0.07, 'square', 0.07); setTimeout(() => blip(1320, 0.09, 'square', 0.05), 40); },\n    back: () => blip(360, 0.09, 'square', 0.06),\n    start: () => {\n      blip(520, 0.08, 'square', 0.07);\n      setTimeout(() => blip(780, 0.08, 'square', 0.07), 70);\n      setTimeout(() => blip(1040, 0.12, 'square', 0.07), 140);\n    }\n  };\n})();\n\n/* ==========================================================\n   Content\n   ========================================================== */\nconst MENUS = {\n  main: {\n    crumbs: ['Main Menu'],\n    hintTag: 'HINT',\n    items: [\n      { id: 'projects',     label: 'Projects',       hint: 'Tales from the workshop.',\n        preview: { title: 'PROJECTS', sub: 'Things I\\u2019ve shipped, broken, and occasionally finished.',\n          list: ['Halftone Harbor', 'Midnight Protocol', 'Paper Arcade', 'Lumen Notes'] } },\n      { id: 'testimonials', label: 'Testimonials',   hint: 'Nice words from real humans.',\n        preview: { title: 'TESTIMONIALS', sub: 'Unsolicited kind messages. Receipts included.',\n          list: ['Clients', 'Collaborators', 'Strangers'] } },\n      { id: 'links',        label: 'Links',          hint: 'The rest of the internet.',\n        preview: { title: 'LINKS', sub: 'Where else I live online. Follow at your own risk.',\n          list: ['GitHub', 'Bluesky', 'Email', 'RSS'] } },\n      { id: 'about',        label: 'About',          hint: 'A short story about Codecaine.',\n        preview: { title: 'ABOUT', sub: 'Who\\u2019s driving this thing and why.',\n          list: ['Bio', 'Now', 'Colophon'] } },\n      { id: 'guestbook',    label: 'Guestbook',      hint: 'Sign the wall. Leave no spam.',\n          preview: { title: 'GUESTBOOK', sub: 'Say hi, drop a doodle, sign with a date stamp.',\n          list: ['Recent signs', 'Top signs', 'Leave a note'] } },\n    ]\n  }\n};\n\nconst PROJECTS = [\n  { title: 'Halftone Harbor',   year: '2025', kind: 'WEB',  tags: ['react', 'canvas', 'shader'],  thumb: '// HARBOR.JS' },\n  { title: 'Midnight Protocol', year: '2025', kind: 'TOOL', tags: ['rust', 'cli'],                 thumb: '// PROTOCOL.RS' },\n  { title: 'Paper Arcade',      year: '2024', kind: 'GAME', tags: ['unity', 'c#', 'design'],       thumb: '// ARCADE.CS' },\n  { title: 'Lumen Notes',       year: '2024', kind: 'APP',  tags: ['swift', 'ios'],                thumb: '// LUMEN.SWIFT' },\n  { title: 'Trellis',           year: '2023', kind: 'WEB',  tags: ['ts', 'svg', 'motion'],         thumb: '// TRELLIS.TS' },\n  { title: 'Fieldcode Zine',    year: '2023', kind: 'PRINT',tags: ['print', 'typography'],         thumb: '// ZINE.INDD' },\n];\n\nconst TESTIMONIALS = [\n  { q: 'Ships faster than my espresso machine. Half the noise, twice the caffeine.', a: '\\u2014 A. Chen, Product Lead' },\n  { q: 'I asked for a landing page. They gave me a playable one. I\\u2019m not mad.', a: '\\u2014 J. Okafor, Founder' },\n  { q: 'Genuinely weird in the best way. Also: deadlines? Hit.', a: '\\u2014 M. Ramos, Creative Director' },\n  { q: 'We extended the contract twice. That\\u2019s the whole review.', a: '\\u2014 L. Park, Engineering Mgr' },\n];\n\nconst LINKS = [\n  { label: 'GITHUB',  url: 'github.com/codecaine',        icon: 'GH' },\n  { label: 'BLUESKY', url: '@codecaine.bsky.social',       icon: 'BS' },\n  { label: 'EMAIL',   url: 'hi@codecaine.dev',             icon: '@' },\n  { label: 'RSS',     url: 'codecaine.dev/feed.xml',       icon: 'RSS' },\n  { label: 'READING', url: 'codecaine.dev/reading',        icon: 'BK' },\n];\n\n/* ==========================================================\n   Screen router\n   ========================================================== */\nconst $screens = document.getElementById('screens');\nlet state = { screen: 'title', selected: 0, stack: [] };\n\n// Persist position\ntry {\n  const saved = JSON.parse(localStorage.getItem('codecaine-state') || 'null');\n  if (saved && saved.screen) state = { ...state, ...saved };\n} catch {}\nfunction persist() {\n  localStorage.setItem('codecaine-state', JSON.stringify({ screen: state.screen, selected: state.selected, stack: state.stack }));\n}\n\nfunction render() {\n  $screens.innerHTML = '';\n  if (state.screen === 'title')     $screens.appendChild(renderTitle());\n  else if (state.screen === 'main') $screens.appendChild(renderMenu('main'));\n  else { state.screen = 'main'; $screens.appendChild(renderMenu('main')); }\n  persist();\n}\n\n/* ---- Title ---- */\nfunction renderTitle() {\n  const el = document.createElement('div');\n  el.id = 'title-screen';\n  el.className = 'screen active';\n  el.setAttribute('data-screen-label', '01 Title');\n  el.innerHTML = `\n    <div style=\"position:relative;\">\n      <div class=\"title-logo chroma\">CODECAINE<span class=\"title-tm\">\\u2122<\u002Fspan><\u002Fdiv>\n      <div class=\"title-sub chroma\">personal site // v4.06<\u002Fdiv>\n      <div class=\"title-press\">PRESS&nbsp;&nbsp;START<\u002Fdiv>\n      <div class=\"title-copyright\">\n        &copy; 2026 CODECAINE LABS &nbsp;//&nbsp; HAND-ASSEMBLED ON A WEEKNIGHT<br>\n        NO COOKIES, NO TRACKING, NO QUARTERS REQUIRED\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  el.addEventListener('click', enterFromTitle);\n  return el;\n}\nfunction enterFromTitle() {\n  Audio.start();\n  state.screen = 'main'; state.selected = 0;\n  render();\n}\n\n/* ---- Menu shell builder ---- */\nfunction renderMenu(key) {\n  const menu = MENUS[key];\n  const el = document.createElement('div');\n  el.className = 'screen active';\n  el.setAttribute('data-screen-label', '02 Main Menu');\n  const selected = menu.items[state.selected] || menu.items[0];\n  el.innerHTML = `\n    <div class=\"menu-shell\">\n      <div class=\"header-bar\">\n        <div class=\"crumb\">Main Menu<\u002Fdiv>\n        <div class=\"header-slits\">\n          <div class=\"slit\"><\u002Fdiv>\n          <div class=\"slit\"><\u002Fdiv>\n          <div class=\"slit\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"menu-frame\">\n        <div class=\"menu-list\">\n          ${menu.items.map((it, i) => `\n            <div class=\"pill ${i === state.selected ? 'selected' : ''}\" data-i=\"${i}\">\n              ${it.label}\n              <div class=\"pill-tip\"><\u002Fdiv>\n            <\u002Fdiv>\n          `).join('')}\n        <\u002Fdiv>\n        <div class=\"ns-divider\">\n          <div class=\"tick-row\"><\u002Fdiv>\n          <div class=\"ns-label\">NEXT SCREEN<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"preview\">\n          <div class=\"preview-label\">PREVIEW<\u002Fdiv>\n          <div class=\"preview-title\">${selected.preview.title}<\u002Fdiv>\n          <div class=\"preview-sub\">${selected.preview.sub}<\u002Fdiv>\n          <div class=\"preview-list\">\n            ${selected.preview.list.map(x => `<div>${x}<\u002Fdiv>`).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint-bar\">\n        <span>${selected.preview.title}: ${selected.hint}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  // Wire up clicks\n  el.querySelectorAll('.pill').forEach(p => {\n    const i = +p.dataset.i;\n    p.addEventListener('mouseenter', () => { if (state.selected !== i) { state.selected = i; Audio.move(); render(); } });\n    p.addEventListener('click', () => { Audio.select(); /* pills are decorative in the 2-screen demo */ });\n  });\n  return el;\n}\n\nfunction enterItem(id) {\n  Audio.select();\n  state.stack.push({ screen: state.screen, selected: state.selected });\n  state.screen = id; state.selected = 0;\n  render();\n}\nfunction goBack() {\n  Audio.back();\n  const prev = state.stack.pop();\n  if (prev) { state.screen = prev.screen; state.selected = prev.selected; }\n  else     { state.screen = 'main'; state.selected = 0; }\n  render();\n}\n\n/* ---- Projects detail ---- */\nfunction renderProjects() {\n  const el = document.createElement('div');\n  el.className = 'screen active';\n  el.setAttribute('data-screen-label', '03 Projects');\n  const sel = PROJECTS[state.selected] || PROJECTS[0];\n  el.innerHTML = `\n    <div class=\"menu-shell\">\n      <div class=\"header-bar\">\n        <div class=\"crumb\">Main Menu<\u002Fdiv>\n        <div class=\"crumb-sep\"><\u002Fdiv>\n        <div class=\"crumb active chroma\">Projects<\u002Fdiv>\n        <div class=\"header-line\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"menu-frame\" style=\"grid-template-columns: 1fr;\">\n        <div class=\"projects-grid\">\n          ${PROJECTS.map((p, i) => `\n            <div class=\"project-card ${i === state.selected ? 'selected' : ''}\" data-i=\"${i}\">\n              <div class=\"project-thumb\">${p.thumb}<\u002Fdiv>\n              <div class=\"project-title\">${p.title}<\u002Fdiv>\n              <div class=\"project-meta\">${p.kind} &middot; ${p.year}<\u002Fdiv>\n              <div class=\"project-tags\">\n                ${p.tags.map(t => `<span class=\"project-tag\">${t}<\u002Fspan>`).join('')}\n              <\u002Fdiv>\n            <\u002Fdiv>\n          `).join('')}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint-bar\">\n        <span class=\"hint-tag\">//&nbsp;HINT<\u002Fspan>\n        <span>${sel.title} &mdash; ${sel.tags.join(' &middot; ')}. Press B to return.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  el.querySelectorAll('.project-card').forEach(c => {\n    const i = +c.dataset.i;\n    c.addEventListener('mouseenter', () => { if (state.selected !== i) { state.selected = i; Audio.move(); render(); } });\n    c.addEventListener('click', () => { Audio.select(); alert('Project detail: ' + PROJECTS[i].title + '\\\\n\\\\n(Wire to your real content here.)'); });\n  });\n  return el;\n}\n\n/* ---- Testimonials ---- */\nfunction renderTestimonials() {\n  const el = document.createElement('div');\n  el.className = 'screen active';\n  el.setAttribute('data-screen-label', '04 Testimonials');\n  el.innerHTML = `\n    <div class=\"menu-shell\">\n      <div class=\"header-bar\">\n        <div class=\"crumb\">Main Menu<\u002Fdiv>\n        <div class=\"crumb-sep\"><\u002Fdiv>\n        <div class=\"crumb active chroma\">Testimonials<\u002Fdiv>\n        <div class=\"header-line\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"menu-frame\" style=\"grid-template-columns: 1fr;\">\n        <div class=\"stub\" style=\"overflow:auto;\">\n          <h2 class=\"chroma\">Receipts<\u002Fh2>\n          ${TESTIMONIALS.map(t => `\n            <div class=\"testimonial-card\">\n              <div class=\"q\">\\u201C${t.q}\\u201D<\u002Fdiv>\n              <div class=\"a\">${t.a}<\u002Fdiv>\n            <\u002Fdiv>\n          `).join('')}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint-bar\">\n        <span class=\"hint-tag\">//&nbsp;HINT<\u002Fspan>\n        <span>Press B (or Esc) to return to Main Menu.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  return el;\n}\n\n/* ---- Links ---- */\nfunction renderLinks() {\n  const el = document.createElement('div');\n  el.className = 'screen active';\n  el.setAttribute('data-screen-label', '05 Links');\n  el.innerHTML = `\n    <div class=\"menu-shell\">\n      <div class=\"header-bar\">\n        <div class=\"crumb\">Main Menu<\u002Fdiv>\n        <div class=\"crumb-sep\"><\u002Fdiv>\n        <div class=\"crumb active chroma\">Links<\u002Fdiv>\n        <div class=\"header-line\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"menu-frame\" style=\"grid-template-columns: 1fr;\">\n        <div class=\"stub\">\n          <h2 class=\"chroma\">Directory<\u002Fh2>\n          <div>\n            ${LINKS.map((l, i) => `\n              <div class=\"link-row ${i === state.selected ? 'selected' : ''}\" data-i=\"${i}\">\n                <div class=\"label\">${l.label}<\u002Fdiv>\n                <div class=\"url\">${l.url}<\u002Fdiv>\n                <div class=\"arrow\">&gt;<\u002Fdiv>\n              <\u002Fdiv>\n            `).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint-bar\">\n        <span class=\"hint-tag\">//&nbsp;HINT<\u002Fspan>\n        <span>${(LINKS[state.selected] || LINKS[0]).label} \\u2014 ${(LINKS[state.selected] || LINKS[0]).url}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  el.querySelectorAll('.link-row').forEach(r => {\n    const i = +r.dataset.i;\n    r.addEventListener('mouseenter', () => { if (state.selected !== i) { state.selected = i; Audio.move(); render(); } });\n    r.addEventListener('click', () => { Audio.select(); alert('Would open: ' + LINKS[i].url); });\n  });\n  return el;\n}\n\n/* ---- About ---- */\nfunction renderAbout() {\n  const el = document.createElement('div');\n  el.className = 'screen active';\n  el.setAttribute('data-screen-label', '06 About');\n  el.innerHTML = `\n    <div class=\"menu-shell\">\n      <div class=\"header-bar\">\n        <div class=\"crumb\">Main Menu<\u002Fdiv>\n        <div class=\"crumb-sep\"><\u002Fdiv>\n        <div class=\"crumb active chroma\">About<\u002Fdiv>\n        <div class=\"header-line\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"menu-frame\" style=\"grid-template-columns: 1fr;\">\n        <div class=\"stub\">\n          <h2 class=\"chroma\">Player One<\u002Fh2>\n          <p>Codecaine is a workshop run by one caffeinated human who designs, builds, and occasionally demolishes software for a living. Shipping since the era of CRT televisions and save files that fit on a memory card.<\u002Fp>\n          <p>Currently: taking on small, strange, high-polish commissions. Interfaces that feel like objects. Tools that feel like toys. Websites that remember they are, in fact, on a computer.<\u002Fp>\n          <p style=\"color: var(--amber); font-family: 'Orbitron', sans-serif; font-size: 18px; letter-spacing: 0.2em; margin-top: 30px;\">// STATS<\u002Fp>\n          <p>HP 87/100 &nbsp;&middot;&nbsp; MP 42/60 &nbsp;&middot;&nbsp; XP 9,182 &nbsp;&middot;&nbsp; COFFEE STREAK 2,118 DAYS<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint-bar\">\n        <span class=\"hint-tag\">//&nbsp;HINT<\u002Fspan>\n        <span>Hand-crafted artisanal HTML. Press B to return.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  return el;\n}\n\n/* ==========================================================\n   Keyboard\n   ========================================================== */\nwindow.addEventListener('keydown', e => {\n  if (state.screen === 'title') {\n    if (['Enter', ' ', 'NumpadEnter'].includes(e.key)) { enterFromTitle(); e.preventDefault(); }\n    return;\n  }\n\n  // Count items on current screen\n  let count = 0, isGrid = false;\n  if (state.screen === 'main') count = MENUS.main.items.length;\n\n  if (e.key === 'ArrowUp') {\n    if (count) { state.selected = isGrid ? Math.max(0, state.selected - 3) : (state.selected - 1 + count) % count; Audio.move(); render(); e.preventDefault(); }\n  } else if (e.key === 'ArrowDown') {\n    if (count) { state.selected = isGrid ? Math.min(count - 1, state.selected + 3) : (state.selected + 1) % count; Audio.move(); render(); e.preventDefault(); }\n  } else if (e.key === 'ArrowLeft') {\n    if (isGrid) { state.selected = Math.max(0, state.selected - 1); Audio.move(); render(); e.preventDefault(); }\n  } else if (e.key === 'ArrowRight') {\n    if (isGrid) { state.selected = Math.min(count - 1, state.selected + 1); Audio.move(); render(); e.preventDefault(); }\n  } else if (['Enter', ' ', 'NumpadEnter'].includes(e.key)) {\n    Audio.select(); e.preventDefault();\n  } else if (['Escape', 'Backspace', 'b', 'B'].includes(e.key)) {\n    if (state.screen === 'main') { state.screen = 'title'; state.selected = 0; Audio.back(); render(); e.preventDefault(); }\n  }\n});\n\n/* ==========================================================\n   Tweaks — edit-mode protocol\n   ========================================================== */\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  \"crt\": true,\n  \"audio\": false,\n  \"speed\": 1,\n  \"hue\": 48,\n  \"font\": \"orbitron\"\n}/*EDITMODE-END*/;\n\nlet tweaks = { ...TWEAK_DEFAULTS };\n\nfunction applyTweaks() {\n  document.getElementById('crt').classList.toggle('off', !tweaks.crt);\n  Audio.set(tweaks.audio);\n  document.querySelectorAll('.vortex .ring').forEach(r => {\n    r.style.animationDuration = (90 / Math.max(0.1, tweaks.speed)) + 's';\n  });\n  const h = tweaks.hue;\n  const root = document.documentElement.style;\n  // Map hue to amber variants via hsl\n  root.setProperty('--amber',      `hsl(${h}, 90%, 54%)`);\n  root.setProperty('--amber-deep', `hsl(${h}, 85%, 34%)`);\n  root.setProperty('--amber-glow', `hsl(${h}, 95%, 70%)`);\n\n  const fontMap = {\n    orbitron: \"'Orbitron', sans-serif\",\n    michroma: \"'Michroma', sans-serif\",\n    mono: \"'JetBrains Mono', monospace\",\n  };\n  document.querySelectorAll('.title-logo, .title-sub, .title-press, .crumb, .pill, .preview-title, .hint-bar, .preview-label, .preview-list, .project-title, .project-meta, .stub h2, .testimonial-card .a, .link-row .label')\n    .forEach(n => n.style.fontFamily = fontMap[tweaks.font]);\n}\n\nfunction wireTweaks() {\n  const crt = document.getElementById('tw-crt');\n  const audio = document.getElementById('tw-audio');\n  const speed = document.getElementById('tw-speed');\n  const hue = document.getElementById('tw-hue');\n  const font = document.getElementById('tw-font');\n  crt.checked = tweaks.crt; audio.checked = tweaks.audio;\n  speed.value = tweaks.speed; hue.value = tweaks.hue; font.value = tweaks.font;\n  function push(partial) {\n    tweaks = { ...tweaks, ...partial };\n    applyTweaks();\n    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: partial }, '*'); } catch {}\n  }\n  crt.addEventListener('change', () => push({ crt: crt.checked }));\n  audio.addEventListener('change', () => push({ audio: audio.checked }));\n  speed.addEventListener('input', () => push({ speed: +speed.value }));\n  hue.addEventListener('input', () => push({ hue: +hue.value }));\n  font.addEventListener('change', () => push({ font: font.value }));\n}\n\nwindow.addEventListener('message', e => {\n  const d = e.data || {};\n  if (d.type === '__activate_edit_mode')   document.getElementById('tweaks-panel').classList.add('on');\n  if (d.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('on');\n});\ntry { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}\n\n/* Boot */\nrender();\napplyTweaks();\nwireTweaks();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
