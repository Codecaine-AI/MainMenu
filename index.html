<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CODECAINE</title>
<template id="__bundler_thumbnail" data-bg-color="#0a0820">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0a0820"/>
    <g transform="translate(600 400)">
      <circle r="240" fill="none" stroke="#f6c419" stroke-width="8" opacity="0.3"/>
      <circle r="160" fill="none" stroke="#f6c419" stroke-width="8" opacity="0.5"/>
      <circle r="90" fill="none" stroke="#f6c419" stroke-width="8" opacity="0.8"/>
      <text x="0" y="18" text-anchor="middle" font-family="Arial Black, sans-serif" font-style="italic" font-weight="900" font-size="72" fill="#f6c419">CC</text>
    </g>
  </svg>
</template>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Michroma&family=Saira+Condensed:ital,wght@1,700;1,800;1,900&family=Roboto+Condensed:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  :root {
    /*EDITMODE-BEGIN*/
    --tweaks: 0;
    /*EDITMODE-END*/
    --amber: #f6c419;
    --amber-deep: #b8860b;
    --amber-glow: #ffe066;
    --ink: #0a0820;
    --ink-2: #120a2e;
    --ink-3: #1a0f3d;
    --cyan: #7fd8ff;
    --magenta: #e8539e;
    --chrome: #d8c77a;
    --hint-bg: #f4ecd3;
    --hint-ink: #1a0f3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #eee; font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ---- Fixed 1440x1080 (4:3) stage, scaled to viewport ---- */
  #stage-wrap { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  #stage {
    position: relative;
    width: 1440px;
    height: 1080px;
    transform-origin: center center;
    overflow: hidden;
    background: #000;
  }

  /* ---- Vortex / grid tunnel background ---- */
  .vortex {
    position: absolute; inset: -10%;
    background:
      radial-gradient(ellipse at center, rgba(40,20,90,0.0) 0%, rgba(10,8,32,0.7) 60%, #000 100%);
    z-index: 0;
    pointer-events: none;
  }
  .vortex .ring {
    position: absolute; inset: 0;
    background-image:
      repeating-conic-gradient(from 0deg,
        rgba(255, 200, 60, 0.0) 0deg 2deg,
        rgba(255, 200, 60, 0.06) 2deg 3deg,
        rgba(255, 200, 60, 0.0) 3deg 6deg),
      repeating-radial-gradient(circle at 50% 50%,
        rgba(180, 120, 255, 0.12) 0 2px,
        transparent 2px 60px);
    mix-blend-mode: screen;
    animation: spin 90s linear infinite;
  }
  .vortex .ring.r2 {
    animation-duration: 140s;
    animation-direction: reverse;
    opacity: .5;
    filter: hue-rotate(40deg);
  }
  .vortex .haze {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 40%, rgba(120, 60, 200, 0.35), transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(200, 100, 40, 0.25), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(30, 14, 70, 0.6), transparent 70%);
    mix-blend-mode: screen;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- CRT overlay ---- */
  .crt {
    position: absolute; inset: 0; z-index: 90; pointer-events: none;
  }
  .crt .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.25) 3px,
      rgba(0,0,0,0) 4px);
    mix-blend-mode: multiply;
  }
  .crt .vign {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  .crt .rgb {
    position: absolute; inset: 0;
    background:
      linear-gradient(to right, rgba(255,50,80,.04), transparent 8%, transparent 92%, rgba(80,200,255,.04));
    mix-blend-mode: screen;
  }
  .crt.off { display: none; }

  /* ---- Chromatic aberration on key elements ---- */
  .chroma { text-shadow: 1.5px 0 0 rgba(255, 60, 90, 0.55), -1.5px 0 0 rgba(80, 200, 255, 0.55); }

  /* shared chunky italic display font */
  .ital-display {
    font-family: 'Saira Condensed', 'Roboto Condensed', system-ui, sans-serif;
    font-style: italic;
    font-weight: 800;
    letter-spacing: 0.01em;
  }

  /* ---- Screen router ---- */
  .screen { position: absolute; inset: 0; z-index: 10; display: none; }
  .screen.active { display: block; }

  /* ============================================
     TITLE SCREEN
     ============================================ */
  #title-screen { display: grid; place-items: center; text-align: center; }
  #title-screen.active { display: grid; }
  .title-logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 280px;
    letter-spacing: 0.04em;
    line-height: 0.9;
    color: transparent;
    background: linear-gradient(180deg, #fff9e0 0%, #f6c419 40%, #8a5a00 75%, #f4e3a3 100%);
    -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 0 30px rgba(246, 196, 25, 0.45)) drop-shadow(0 6px 0 #3a2200);
    text-shadow: 0 0 80px rgba(255, 220, 120, 0.3);
    position: relative;
  }
  .title-sub {
    font-family: 'Orbitron', sans-serif;
    font-weight: 500;
    font-size: 110px;
    letter-spacing: 0.1em;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.6), 0 4px 0 rgba(0,0,0,0.7);
    margin-top: -10px;
  }
  .title-press {
    margin-top: 80px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 56px;
    letter-spacing: 0.25em;
    color: var(--amber);
    text-shadow: 0 0 20px rgba(246, 196, 25, 0.7), 0 3px 0 #3a2200;
    animation: blink 1.1s steps(2, end) infinite;
  }
  @keyframes blink { 50% { opacity: 0.15; } }
  .title-copyright {
    position: absolute; bottom: 60px; left: 0; right: 0; text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; color: #ddd; letter-spacing: 0.05em; line-height: 1.6;
    opacity: 0.85;
  }
  .title-tm { font-size: 0.35em; vertical-align: super; margin-left: 6px; color: #fff; }

  /* ============================================
     MENU SCREEN (shared chrome)
     ============================================ */
  .menu-shell {
    position: absolute; inset: 0;
    padding: 70px 90px 60px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 0;
  }

  /* Top header bar — sits ON the top border of the frame */
  .header-bar {
    position: relative;
    display: flex; align-items: flex-end; gap: 0;
    height: 76px;
    padding-left: 50px;
    /* drop a little so the header sits on top of the frame's top border */
    margin-bottom: -16px;
    z-index: 5;
  }
  .crumb {
    font-family: 'Saira Condensed', 'Roboto Condensed', sans-serif;
    font-style: italic; font-weight: 800;
    font-size: 56px; letter-spacing: 0.01em;
    color: transparent;
    -webkit-text-stroke: 2px #f6c419;
    text-shadow:
      0 0 12px rgba(246,196,25,0.5),
      3px 3px 0 rgba(0,0,0,0.6);
    padding: 0 24px 0 14px;
    line-height: 1;
    /* sit the text above the line and let bg cut through the border */
    background: var(--ink-2);
    box-shadow: 0 0 30px 8px var(--ink-2);
    position: relative;
  }
  .crumb.fill {
    color: #f6c419;
    -webkit-text-stroke: 0;
  }
  /* The 3 amber pipe slits next to the header */
  .header-slits {
    display: flex; flex-direction: column; gap: 4px;
    margin-left: 0px;
    margin-bottom: 14px;
    padding-left: 14px;
    background: var(--ink-2);
    box-shadow: 0 0 24px 8px var(--ink-2);
    position: relative;
  }
  .header-slits .slit {
    height: 4px; width: 100px;
    background: #f6c419;
    box-shadow: 0 0 6px rgba(246,196,25,0.6);
  }
  .header-slits .slit:nth-child(1) { width: 70px; }
  .header-slits .slit:nth-child(2) { width: 100px; }
  .header-slits .slit:nth-child(3) { width: 60px; }
  /* Old header-line removed */
  .header-line { display: none; }
  .crumb-sep { display: none; }
  .ns-divider {
    position: relative;
    display: grid; place-items: center;
  }
  .ns-divider .tick-row {
    position: absolute; top: 30px; bottom: 30px; left: 50%; transform: translateX(-50%);
    width: 4px;
    background-image: repeating-linear-gradient(to bottom,
      rgba(246,196,25,0.55) 0 4px, transparent 4px 14px);
  }
  .ns-label {
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-family: 'Saira Condensed', 'Roboto Condensed', sans-serif;
    font-style: italic; font-weight: 800;
    letter-spacing: 0.45em; font-size: 18px;
    color: rgba(246,196,25,0.85);
    text-shadow: 0 0 8px rgba(246,196,25,0.5);
    background: transparent;
    padding: 30px 4px;
    z-index: 2;
  }

  /* Main menu frame — beveled, raised chrome */
  .menu-frame {
    position: relative;
    border-radius: 32px 60px 32px 60px / 32px 60px 32px 60px;
    background:
      linear-gradient(180deg, rgba(10, 8, 32, 0.55), rgba(20, 10, 50, 0.45)),
      radial-gradient(ellipse at 30% 20%, rgba(246, 196, 25, 0.06), transparent 50%);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.8),
      0 0 0 2px rgba(0,0,0,0.9),
      0 0 0 5px rgba(246, 196, 25, 0.85),
      0 0 0 6px rgba(255, 240, 160, 0.4),
      0 0 0 9px rgba(0,0,0,0.75),
      0 0 0 11px rgba(246, 196, 25, 0.22),
      inset 0 0 60px rgba(246, 196, 25, 0.06),
      inset 0 2px 0 rgba(255, 220, 120, 0.18);
    display: grid;
    grid-template-columns: 1fr 56px 500px;
    overflow: visible;
    perspective: 1600px;
  }
  .menu-frame::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.22;
    background:
      linear-gradient(rgba(127, 216, 255, 0.55) 1px, transparent 1px) 0 0/ 60px 60px,
      linear-gradient(90deg, rgba(127, 216, 255, 0.55) 1px, transparent 1px) 0 0/ 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);
    border-radius: inherit;
  }
  .menu-frame::after {
    /* inner thin tick outline */
    content: ''; position: absolute; inset: 16px; pointer-events: none;
    border: 1px solid rgba(246, 196, 25, 0.25);
    border-radius: 24px 52px 24px 52px / 24px 52px 24px 52px;
  }

  .menu-list {
    position: relative; z-index: 2;
    padding: 50px 20px 50px 80px;
    display: flex; flex-direction: column; gap: 14px;
    justify-content: center;
    align-items: flex-start;
  }
  /* Each pill is auto-width, with hand-placed left/right padding for variable widths */
  .menu-list .pill { width: auto; }
  .menu-list .pill:nth-child(1) { padding-right: 90px;  margin-left:  10px; }
  .menu-list .pill:nth-child(2) { padding-right: 130px; margin-left: 30px; }
  .menu-list .pill:nth-child(3) { padding-right: 110px; margin-left:  0px; }
  .menu-list .pill:nth-child(4) { padding-right: 150px; margin-left: 24px; }
  .menu-list .pill:nth-child(5) { padding-right: 100px; margin-left: 12px; }

  /* Pill button */
  .pill {
    position: relative;
    height: 76px;
    padding: 0 60px 0 36px;
    display: inline-flex; align-items: center;
    font-family: 'Saira Condensed', 'Roboto Condensed', sans-serif;
    font-style: italic; font-weight: 800;
    font-size: 50px;
    letter-spacing: 0.005em;
    color: #f8e79a;
    background: linear-gradient(180deg, rgba(35, 18, 6, 0.9) 0%, rgba(15, 8, 4, 0.95) 100%);
    border: 3px solid #f6c419;
    border-radius: 999px;
    box-shadow:
      inset 0 2px 0 rgba(255, 220, 120, 0.22),
      inset 0 -2px 0 rgba(0,0,0,0.5),
      0 4px 0 rgba(0,0,0,0.55);
    cursor: pointer;
    transition: padding-left .15s ease, transform .15s ease, filter .12s ease;
    user-select: none;
  }
  .pill:hover { filter: brightness(1.15); }
  .pill .pill-tip {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 999px;
    background: radial-gradient(circle at 30% 30%, #ffe066, #b8860b 60%, #3a2200 100%);
    box-shadow: 0 0 8px rgba(246, 196, 25, 0.5);
  }

  .pill.selected {
    color: #1a0a00;
    background: linear-gradient(180deg, #fff4a8 0%, #f6c419 50%, #b8860b 100%);
    border-color: #fff4b0;
    padding-left: 90px;
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,0.55),
      inset 0 -3px 0 rgba(120, 70, 0, 0.5),
      0 0 40px rgba(246, 196, 25, 0.45),
      0 4px 0 rgba(0,0,0,0.55);
    text-shadow: 0 1px 0 rgba(255,255,255,0.35);
    transform: translateX(-30px);
    z-index: 3;
  }
  /* Yellow arrow tab on the LEFT of selected pill */
  .pill.selected::before {
    content: '';
    position: absolute; left: -50px; top: 50%;
    width: 92px; height: 70px;
    transform: translateY(-50%);
    background: linear-gradient(180deg, #fff4a8 0%, #f6c419 50%, #b8860b 100%);
    clip-path: polygon(0% 50%, 30% 0%, 100% 0%, 100% 100%, 30% 100%);
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5));
    z-index: -1;
  }
  .pill.selected .pill-tip {
    width: 38px; height: 38px;
    background: radial-gradient(circle at 35% 35%, #eaff99, #8adf3a 40%, #2a5a00 90%);
    box-shadow: 0 0 24px rgba(150, 255, 80, 0.9), inset 0 0 8px rgba(255,255,255,0.6);
    right: 10px;
    animation: orb-pulse 1.4s ease-in-out infinite;
    z-index: 4;
  }
  @keyframes orb-pulse {
    0%, 100% { box-shadow: 0 0 24px rgba(150, 255, 80, 0.9), inset 0 0 8px rgba(255,255,255,0.6); }
    50%      { box-shadow: 0 0 40px rgba(180, 255, 120, 1), inset 0 0 12px rgba(255,255,255,0.9); }
  }

  /* Preview panel — small, tilted in 3D perspective */
  .preview {
    position: relative; z-index: 2;
    margin: 70px 40px 70px 0;
    border: 2px solid rgba(246, 196, 25, 0.55);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(8, 6, 28, 0.85), rgba(12, 8, 40, 0.75));
    padding: 30px 24px 24px;
    display: flex; flex-direction: column; gap: 12px;
    overflow: hidden;
    transform: rotateY(-22deg) rotateX(3deg) translateZ(-30px);
    transform-origin: left center;
    box-shadow:
      -20px 14px 40px rgba(0,0,0,0.55),
      inset 0 0 40px rgba(127,216,255,0.05),
      inset 0 2px 0 rgba(255,220,120,0.2);
  }
  .preview::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.25;
    background:
      linear-gradient(rgba(127, 216, 255, 0.4) 1px, transparent 1px) 0 0/ 40px 40px,
      linear-gradient(90deg, rgba(127, 216, 255, 0.4) 1px, transparent 1px) 0 0/ 40px 40px;
    mask-image: linear-gradient(180deg, black 20%, transparent 95%);
  }
  .preview-label { display: none; }
  .preview-title { display: none; }
  .preview-sub { display: none; }
  .preview-list {
    list-style: none; display: flex; flex-direction: column; gap: 14px;
    font-family: 'Saira Condensed', 'Roboto Condensed', sans-serif;
    font-style: italic; font-weight: 700;
    font-size: 30px; color: #f4ecd3;
    position: relative; z-index: 2;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
  }
  .preview-list li { padding-left: 0; position: relative; letter-spacing: 0.01em; }
  .preview-list li::before {
    display: none;
    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 8px; height: 8px; background: var(--amber); border-radius: 2px;
    box-shadow: 0 0 8px rgba(246,196,25,0.7);
  }
  .preview-art {
    flex: 1; position: relative; z-index: 2;
    border: 1px solid rgba(127, 216, 255, 0.25);
    background:
      repeating-linear-gradient(135deg, rgba(127,216,255,0.04) 0 20px, rgba(127,216,255,0.0) 20px 40px),
      linear-gradient(180deg, rgba(20,10,50,0.6), rgba(5,3,20,0.9));
    border-radius: 10px;
    display: grid; place-items: center;
    min-height: 200px;
    color: rgba(127,216,255,0.55);
    font-size: 18px; letter-spacing: 0.2em;
  }

  /* Bottom description box — inline with the frame style */
  .hint-bar {
    height: 80px;
    background: linear-gradient(180deg, rgba(20, 12, 50, 0.9), rgba(10, 6, 28, 0.95));
    border: 3px solid #f6c419;
    border-radius: 14px;
    box-shadow:
      0 4px 0 rgba(0,0,0,0.55),
      inset 0 2px 0 rgba(255,220,120,0.18);
    display: flex; align-items: center; padding: 0 36px;
    font-family: 'Saira Condensed', 'Roboto Condensed', sans-serif;
    font-style: italic; font-weight: 700;
    font-size: 36px;
    color: #f4ecd3;
    letter-spacing: 0.01em;
    position: relative;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
    margin-top: 28px;
  }
  .hint-bar .hint-tag { display: none; }

  /* ============================================
     PROJECTS DETAIL SCREEN
     ============================================ */
  .projects-grid {
    padding: 40px 50px;
    position: relative; z-index: 2;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px;
    align-content: start;
    height: 100%;
    overflow: hidden;
  }
  .project-card {
    position: relative;
    background: linear-gradient(180deg, rgba(15,10,40,0.9), rgba(8,5,24,0.95));
    border: 2px solid rgba(246, 196, 25, 0.4);
    border-radius: 14px;
    padding: 24px;
    cursor: pointer;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    display: flex; flex-direction: column; gap: 14px;
    min-height: 240px;
  }
  .project-card.selected {
    border-color: var(--amber);
    box-shadow: 0 0 40px rgba(246,196,25,0.4), inset 0 0 0 2px rgba(255,220,120,0.4);
    transform: translateY(-4px);
  }
  .project-thumb {
    height: 120px; border-radius: 8px;
    background:
      repeating-linear-gradient(45deg, rgba(246,196,25,0.1) 0 8px, transparent 8px 16px),
      linear-gradient(135deg, #2a1a60, #140a3a);
    border: 1px solid rgba(246,196,25,0.25);
    display: grid; place-items: center;
    color: rgba(246,196,25,0.6);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; letter-spacing: 0.15em;
  }
  .project-title {
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 26px; color: #f8e79a; letter-spacing: 0.02em;
  }
  .project-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; color: #9aa4c0; letter-spacing: 0.05em;
  }
  .project-tags {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto;
  }
  .project-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.1em;
    padding: 3px 10px;
    background: rgba(127, 216, 255, 0.12);
    border: 1px solid rgba(127, 216, 255, 0.35);
    color: var(--cyan);
    border-radius: 999px;
  }

  /* Simple stub screens */
  .stub {
    padding: 60px; position: relative; z-index: 2;
    display: flex; flex-direction: column; gap: 24px;
    font-family: 'Orbitron', sans-serif;
  }
  .stub h2 { font-size: 60px; color: #fff; letter-spacing: 0.04em; }
  .stub p { font-family: 'JetBrains Mono', monospace; font-size: 22px; line-height: 1.7; color: #cfd6e8; max-width: 900px; }

  .testimonial-card {
    border-left: 3px solid var(--amber);
    padding: 16px 28px; margin-bottom: 18px;
    background: rgba(10,8,32,0.5);
    border-radius: 0 10px 10px 0;
  }
  .testimonial-card .q { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #e8e2d0; line-height: 1.6; }
  .testimonial-card .a { font-family: 'Orbitron', sans-serif; margin-top: 10px; font-size: 18px; color: var(--amber); letter-spacing: 0.08em; }

  .link-row {
    display: grid; grid-template-columns: 200px 1fr auto; gap: 24px; align-items: center;
    padding: 18px 28px;
    border: 1px solid rgba(246,196,25,0.3);
    border-radius: 10px;
    margin-bottom: 14px;
    background: rgba(10,8,32,0.5);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .link-row:hover, .link-row.selected { background: rgba(246,196,25,0.08); border-color: var(--amber); }
  .link-row .label { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 26px; color: #f8e79a; letter-spacing: 0.05em; }
  .link-row .url { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #9aa4c0; }
  .link-row .arrow { font-family: 'Orbitron', sans-serif; color: var(--amber); font-size: 30px; }

  /* ============================================
     TWEAKS PANEL
     ============================================ */
  #tweaks-panel {
    position: fixed; bottom: 20px; right: 20px;
    z-index: 1000;
    width: 320px;
    background: rgba(10, 8, 32, 0.96);
    border: 2px solid rgba(246, 196, 25, 0.6);

<script>
/* ==========================================================
   Stage scaler — lock content to 1440x1080 (4:3), fit viewport
   ========================================================== */
function fitStage() {
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('stage-wrap');
  const sw = wrap.clientWidth, sh = wrap.clientHeight;
  const s = Math.min(sw / 1440, sh / 1080);
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitStage);

/* ==========================================================
   Audio blips (WebAudio) — toggleable
   ========================================================== */
const Audio = (() => {
  let ctx = null, enabled = false;
  function ensure() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  function blip(freq = 520, dur = 0.06, type = 'square', gain = 0.06) {
    if (!enabled) return;
    ensure();
    if (ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur);
  }
  return {
    set: v => { enabled = v; },
    move: () => blip(620, 0.05, 'square', 0.04),
    select: () => { blip(880, 0.07, 'square', 0.07); setTimeout(() => blip(1320, 0.09, 'square', 0.05), 40); },
    back: () => blip(360, 0.09, 'square', 0.06),
    start: () => {
      blip(520, 0.08, 'square', 0.07);
      setTimeout(() => blip(780, 0.08, 'square', 0.07), 70);
      setTimeout(() => blip(1040, 0.12, 'square', 0.07), 140);
    }
  };
})();

/* ==========================================================

const $screens = document.getElementById('screens');

} catch {}
function persist() {
  localStorage.setItem('codecaine-state', JSON.stringify({ screen: state.screen, selected: state.selected, stack: state.stack }));
}

function render() {
  $screens.innerHTML = '';

  else if (state.screen === 'main') $screens.appendChild(renderMenu('main'));

}

    p.addEventListener('click', () => { Audio.select(); /* pills are decorative in the 2-screen demo */ });
  });
  return el;
}

function enterItem(id) {
  Audio.select();
  state.stack.push({ screen: state.screen, selected: state.selected });
  state.screen = id; state.selected = 0;
  render();
}
function goBack() {
  Audio.back();
  const prev = state.stack.pop();
  if (prev) { state.screen = prev.screen; state.selected = prev.selected; }
  else     { state.screen = 'main'; state.selected = 0; }
  render();
}

/* ==========================================================
   Keyboard
   ========================================================== */
window.addEventListener('keydown', e => {
  if (state.screen === 'title') {
    if (['Enter', ' ', 'NumpadEnter'].includes(e.key)) { enterFromTitle(); e.preventDefault(); }
    return;
  }

  // Count items on current screen
  let count = 0, isGrid = false;
  if (state.screen === 'main') count = MENUS.main.items.length;

  if (e.key === 'ArrowUp') {
    if (count) { state.selected = isGrid ? Math.max(0, state.selected - 3) : (state.selected - 1 + count) % count; Audio.move(); render(); e.preventDefault(); }
  } else if (e.key === 'ArrowDown') {
    if (count) { state.selected = isGrid ? Math.min(count - 1, state.selected + 3) : (state.selected + 1) % count; Audio.move(); render(); e.preventDefault(); }
  } else if (e.key === 'ArrowLeft') {
    if (isGrid) { state.selected = Math.max(0, state.selected - 1); Audio.move(); render(); e.preventDefault(); }
  } else if (e.key === 'ArrowRight') {
    if (isGrid) { state.selected = Math.min(count - 1, state.selected + 1); Audio.move(); render(); e.preventDefault(); }
  } else if (['Enter', ' ', 'NumpadEnter'].includes(e.key)) {
    Audio.select(); e.preventDefault();
  } else if (['Escape', 'Backspace', 'b', 'B'].includes(e.key)) {
    if (state.screen === 'main') { state.screen = 'title'; state.selected = 0; Audio.back(); render(); e.preventDefault(); }
  }
});

/* ==========================================================
   Tweaks — edit-mode protocol
   ========================================================== */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "crt": true,
  "audio": false,
  "speed": 1,
  "hue": 48,
  "font": "orbitron"
}/*EDITMODE-END*/;

let tweaks = { ...TWEAK_DEFAULTS };

function applyTweaks() {
  document.getElementById('crt').classList.toggle('off', !tweaks.crt);
  Audio.set(tweaks.audio);
  document.querySelectorAll('.vortex .ring').forEach(r => {
    r.style.animationDuration = (90 / Math.max(0.1, tweaks.speed)) + 's';
  });
  const h = tweaks.hue;
  const root = document.documentElement.style;
  // Map hue to amber variants via hsl
  root.setProperty('--amber',      `hsl(${h}, 90%, 54%)`);
  root.setProperty('--amber-deep', `hsl(${h}, 85%, 34%)`);
  root.setProperty('--amber-glow', `hsl(${h}, 95%, 70%)`);

  const fontMap = {
    orbitron: "'Orbitron', sans-serif",
    michroma: "'Michroma', sans-serif",
    mono: "'JetBrains Mono', monospace",
  };
  document.querySelectorAll('.title-logo, .title-sub, .title-press, .crumb, .pill, .preview-title, .hint-bar, .preview-label, .preview-list, .project-title, .project-meta, .stub h2, .testimonial-card .a, .link-row .label')
    .forEach(n => n.style.fontFamily = fontMap[tweaks.font]);
}

function wireTweaks() {
  const crt = document.getElementById('tw-crt');
  const audio = document.getElementById('tw-audio');
  const speed = document.getElementById('tw-speed');
  const hue = document.getElementById('tw-hue');
  const font = document.getElementById('tw-font');
  crt.checked = tweaks.crt; audio.checked = tweaks.audio;
  speed.value = tweaks.speed; hue.value = tweaks.hue; font.value = tweaks.font;
  function push(partial) {
    tweaks = { ...tweaks, ...partial };
    applyTweaks();
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: partial }, '*'); } catch {}
  }
  crt.addEventListener('change', () => push({ crt: crt.checked }));
  audio.addEventListener('change', () => push({ audio: audio.checked }));
  speed.addEventListener('input', () => push({ speed: +speed.value }));
  hue.addEventListener('input', () => push({ hue: +hue.value }));
  font.addEventListener('change', () => push({ font: font.value }));
}

window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === '__activate_edit_mode')   document.getElementById('tweaks-panel').classList.add('on');
  if (d.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('on');
});
try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}

/* Boot */
render();
applyTweaks();
wireTweaks();
</script>
