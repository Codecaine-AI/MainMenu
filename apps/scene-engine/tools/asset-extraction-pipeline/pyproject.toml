[project]
name = "asset-extraction-pipeline"
version = "0.1.0"
description = "Catalog and extract individual visual assets from MELEE menu screens."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.64.0",
  "google-genai>=1.73.1",
  "mirascope>=1.25.0",
  "openai>=1.99.0",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
extract-assets = "asset_extraction_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asset_extraction_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
