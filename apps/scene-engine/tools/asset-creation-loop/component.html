<div class="mm-frame">
  <svg class="mm-svg" viewBox="0 0 393 314" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <!-- Outer glow -->
      <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3.2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Border gradient: lighter top, darker bottom-right -->
      <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#A7A8F2"/>
        <stop offset="35%" stop-color="#8081E2"/>
        <stop offset="70%" stop-color="#6667CE"/>
        <stop offset="100%" stop-color="#55569E"/>
      </linearGradient>

      <!-- Inner bright highlight (thin, runs just inside border) -->
      <linearGradient id="innerHi" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#E6E7FF"/>
        <stop offset="40%" stop-color="#BFC0FA"/>
        <stop offset="100%" stop-color="#7B7CD6"/>
      </linearGradient>

      <!-- Interior fill -->
      <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#2B2E48"/>
        <stop offset="100%" stop-color="#31344F"/>
      </linearGradient>

      <!-- Tab gradient - a bit lighter up top, beveled -->
      <linearGradient id="tabGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#9B9CEE"/>
        <stop offset="50%" stop-color="#7677D9"/>
        <stop offset="100%" stop-color="#5B5CB8"/>
      </linearGradient>

      <!-- Frame silhouette path: rounded rect with chamfered bottom corners -->
      <!-- Points (rough): top-left r=18, top-right r=18, bottom-right chamfer, bottom-left chamfer -->
      <path id="framePath" d="
        M 22 6
        L 371 6
        Q 387 6 387 22
        L 387 274
        Q 387 290 371 290
        L 358 290
        L 344 302
        L 44 302
        L 30 290
        L 22 290
        Q 6 290 6 274
        L 6 22
        Q 6 6 22 6 Z
      "/>

      <!-- Tab path (top-left bulge) -->
      <path id="tabPath" d="
        M 14 34
        L 14 14
        Q 14 4 26 4
        L 150 4
        Q 160 4 162 14
        L 168 38
        Q 170 48 158 48
        L 30 48
        Q 14 48 14 34 Z
      "/>
    </defs>

    <!-- Outer soft halo -->
    <g filter="url(#outerGlow)">
      <use href="#framePath" fill="none" stroke="#9495EE" stroke-width="2" opacity="0.55"/>
    </g>

    <!-- Main border body -->
    <use href="#framePath" fill="url(#borderGrad)"/>

    <!-- Inner highlight layer (slightly inset) -->
    <g transform="translate(196.5 157) scale(0.955) translate(-196.5 -157)">
      <use href="#framePath" fill="url(#innerHi)"/>
    </g>

    <!-- Dark interior (more inset) -->
    <g transform="translate(196.5 157) scale(0.935) translate(-196.5 -157)">
      <use href="#framePath" fill="url(#interior)"/>
    </g>

    <!-- Title tab: glow + body + highlight + interior sliver -->
    <g filter="url(#outerGlow)">
      <use href="#tabPath" fill="none" stroke="#9495EE" stroke-width="1.6" opacity="0.5"/>
    </g>
    <use href="#tabPath" fill="url(#tabGrad)"/>
    <!-- Tab top highlight stroke -->
    <path d="M 18 14 Q 20 8 28 8 L 150 8 Q 158 8 160 16"
          fill="none" stroke="#D7D8FF" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>

    <!-- Main Menu text -->
    <text x="28" y="34"
          font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
          font-size="22"
          font-style="italic"
          font-weight="900"
          fill="#FFFFFF"
          letter-spacing="0.5">Main Menu</text>
  </svg>
</div>
