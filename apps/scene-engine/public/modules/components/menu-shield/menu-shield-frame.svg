<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" aria-hidden="true">
  <style>
    :root {
      --menu-shield-border: #3158e8;
      --menu-shield-border-opacity: 0.96;
      --menu-shield-inner-opacity: 0.84;
      --menu-shield-rib-opacity: 0.88;
      --menu-shield-break-opacity: 0.7;
      --menu-shield-fill-opacity: 0.3;
    }

    svg {
      background: #050711;
    }

    .menu-shield__outer-line,
    .menu-shield__inner-line,
    .menu-shield__panel-break {
      fill: none;
      stroke: var(--menu-shield-border);
      stroke-linecap: butt;
      stroke-linejoin: round;
    }

    .menu-shield__frame-fill {
      fill: var(--menu-shield-border);
      fill-opacity: var(--menu-shield-fill-opacity);
      stroke: none;
    }

    .menu-shield__outer-line {
      stroke-width: 7;
      stroke-opacity: var(--menu-shield-border-opacity);
      filter: drop-shadow(0 0 8px var(--menu-shield-border));
    }

    .menu-shield__inner-line {
      stroke-width: 5;
      stroke-opacity: var(--menu-shield-inner-opacity);
      filter: drop-shadow(0 0 5px var(--menu-shield-border));
    }

    .menu-shield__rib-fill {
      fill: var(--menu-shield-border);
      fill-opacity: 0.18;
      stroke: none;
    }

    .menu-shield__rib-outline {
      fill: none;
      stroke: var(--menu-shield-border);
      stroke-width: 5;
      stroke-linecap: butt;
      stroke-linejoin: miter;
      stroke-opacity: var(--menu-shield-rib-opacity);
    }

    .menu-shield__rib-bottom {
      fill: none;
      stroke: var(--menu-shield-border);
      stroke-width: 5;
      stroke-linecap: butt;
      stroke-opacity: var(--menu-shield-rib-opacity);
    }

    .menu-shield__rib-divider {
      fill: none;
      stroke: var(--menu-shield-border);
      stroke-width: 3;
      stroke-linecap: butt;
      stroke-opacity: var(--menu-shield-rib-opacity);
    }

    .menu-shield__panel-break {
      stroke-width: 4;
      stroke-opacity: var(--menu-shield-break-opacity);
    }

    .menu-shield__bottom-gap-edge {
      fill: var(--menu-shield-border);
      fill-opacity: var(--menu-shield-border-opacity);
      stroke: none;
    }
  </style>
  <g class="menu-shield__frame">
    <path
      class="menu-shield__frame-fill"
      fill-rule="evenodd"
      d="M 334 973 H 207 Q 151 973 151 917 V 220 Q 151 160 211 160 H 630 L 671 90 H 1244 Q 1305 90 1305 151 V 917 Q 1305 973 1249 973 H 1118 L 1118 912 H 1242 Q 1278 912 1278 875 V 151 Q 1278 113 1240 113 H 759 L 718 181 H 217 Q 176 181 176 222 V 876 Q 176 912 212 912 H 334 Z"
    />
    <path class="menu-shield__rib-fill" d="M 633 160.5 H 700.5 L 739 93 H 672 Z" />
    <line class="menu-shield__rib-divider" x1="656" y1="158.7" x2="694.3" y2="93" />
    <line class="menu-shield__rib-divider" x1="678.5" y1="158.7" x2="716.7" y2="93" />
    <path class="menu-shield__rib-outline" d="M 633 160.5 H 700.5 L 739 93 H 672 Z" />
    <line class="menu-shield__rib-bottom" x1="632.6" y1="160.5" x2="700.9" y2="160.5" />
    <path
      class="menu-shield__outer-line"
      d="M 334 973 H 207 Q 151 973 151 917 V 220 Q 151 160 211 160 H 630 L 671 90 H 1244 Q 1305 90 1305 151 V 917 Q 1305 973 1249 973 H 1118"
    />
    <path
      class="menu-shield__inner-line"
      d="M 334 912 H 212 Q 176 912 176 876 V 222 Q 176 181 217 181 H 718 L 759 113 H 1240 Q 1278 113 1278 151 V 875 Q 1278 912 1242 912 H 1118"
    />
    <rect class="menu-shield__bottom-gap-edge" x="331" y="909.5" width="6" height="67" />
    <rect class="menu-shield__bottom-gap-edge" x="1115" y="909.5" width="6" height="67" />
    <line class="menu-shield__panel-break" x1="151" y1="405" x2="176" y2="405" />
    <line class="menu-shield__panel-break" x1="1278" y1="405" x2="1305" y2="405" />
  </g>
</svg>
