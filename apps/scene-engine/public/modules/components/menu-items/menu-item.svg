<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 128" aria-hidden="true">
  <defs>
    <radialGradient id="menu-item-edge-gradient" cx="380" cy="64" r="395" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: var(--menu-items-edge-core, #6b4d12)" />
      <stop offset="0.58" style="stop-color: var(--menu-items-gold, #d3a12b)" />
      <stop offset="0.84" style="stop-color: var(--menu-items-hot-gold, #ffd11a)" />
      <stop offset="1" style="stop-color: var(--menu-items-edge-light, #ffe477)" />
    </radialGradient>
    <radialGradient id="menu-item-marker-gradient" cx="0.45" cy="0.45" r="0.58">
      <stop offset="0" style="stop-color: #fff7a7" />
      <stop offset="0.6" style="stop-color: var(--menu-items-hot-gold, #ffd11a)" />
      <stop offset="1" style="stop-color: var(--menu-items-gold, #d3a12b)" />
    </radialGradient>
  </defs>

  <style>
    :root {
      --menu-items-edge-core: #6b4d12;
      --menu-items-gold: #d3a12b;
      --menu-items-hot-gold: #ffd11a;
      --menu-items-edge-light: #ffe477;
      --menu-items-panel: #050505;
      --menu-items-marker-gray: #d8d8d8;
    }

    .menu-item__edge-fill {
      fill: url(#menu-item-edge-gradient);
      filter: drop-shadow(0 0 8px var(--menu-items-hot-gold));
    }

    .menu-item__internal-cut {
      fill: var(--menu-items-panel);
      fill-rule: evenodd;
    }

    .menu-item__notch-fill {
      fill: var(--menu-items-hot-gold);
      filter: none;
    }

    .menu-item__notch-gap {
      fill: var(--menu-items-panel);
      fill-rule: evenodd;
    }

    .menu-item__notch-lower-gap {
      fill: var(--menu-items-panel);
    }

    .menu-item__notch-cut {
      fill: var(--menu-items-panel);
      fill-rule: evenodd;
    }

    .menu-item__marker {
      opacity: 0;
    }

    .menu-item__marker-glow,
    .menu-item__marker-disc,
    .menu-item__marker-fill {
      fill: url(#menu-item-marker-gradient);
    }

    .menu-item__marker-glow {
      opacity: 0.26;
      filter: drop-shadow(0 0 12px var(--menu-items-hot-gold));
    }

    .menu-item__marker-disc {
      opacity: 0.38;
    }

    .menu-item__marker-ring {
      fill: none;
      stroke: #fff3a0;
      stroke-width: 11;
      opacity: 0.72;
    }

    .menu-item__marker-dark-ring {
      fill: none;
      stroke: var(--menu-items-panel);
      stroke-width: 9;
      opacity: 0.42;
    }

    .menu-item__marker-hole {
      fill: var(--menu-items-panel);
    }

    .menu-item__marker-slice {
      fill: var(--menu-items-marker-gray);
      opacity: 0.62;
    }
  </style>

  <g class="menu-item__asset">
    <path
      class="menu-item__edge-fill"
      d="M 49 8
         H 683
         A 56 56 0 0 1 683 120
         H 31
         L 8 78
         Z"
    />
    <path
      class="menu-item__internal-cut"
      d="M 56.45 21
         H 683
         V 107
         H 38.7
         L 22.94 78.22
         Z"
    />
    <path
      class="menu-item__notch-gap"
      d="M 726 64
         A 43 43 0 1 1 640 64
         A 43 43 0 1 1 726 64
         Z
         M 705 64
         A 22 22 0 1 0 661 64
         A 22 22 0 1 0 705 64
         Z"
    />
    <path
      class="menu-item__notch-fill"
      d="M 678 42
         H 683
         A 22 22 0 0 1 683 86
         H 685
         V 120
         H 678
         Z"
    />
    <path
      class="menu-item__notch-lower-gap"
      d="M 685 86
         H 690
         V 120
         H 685
         Z"
    />
    <path
      class="menu-item__notch-cut"
      d="M 685 55
         C 692 55 695 58.5 695 64
         C 695 69.5 692 73 685 73
         Z"
    />

    <g class="menu-item__marker" transform="translate(683 64)">
      <circle class="menu-item__marker-glow" cx="0" cy="0" r="59" />
      <circle class="menu-item__marker-disc" cx="0" cy="0" r="49" />
      <circle class="menu-item__marker-ring" cx="0" cy="0" r="43" />
      <circle class="menu-item__marker-dark-ring" cx="0" cy="0" r="29" />
      <circle class="menu-item__marker-fill" cx="0" cy="0" r="23" />
      <circle class="menu-item__marker-hole" cx="0" cy="0" r="10" />
      <path
        class="menu-item__marker-slice"
        d="M 10 -60 L 20 -57 L 8 -12 L 8 70 L -2 70 L -2 -8 Z"
      />
    </g>
  </g>
</svg>
