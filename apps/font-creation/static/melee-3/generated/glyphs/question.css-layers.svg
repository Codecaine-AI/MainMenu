  <style>
      :root {
        --melee3-shadow-layer-paint: #050505;
        --melee3-shadow-layer-width: 112px;
        --melee3-shadow-layer-opacity: 1;
        --melee3-shadow-layer-dx: 0px;
        --melee3-shadow-layer-dy: 0px;
        --melee3-outer-depth-layer-paint: #151515;
        --melee3-outer-depth-layer-width: 92px;
        --melee3-outer-depth-layer-opacity: 1;
        --melee3-outer-depth-layer-dx: 0px;
        --melee3-outer-depth-layer-dy: 0px;
        --melee3-rim-glow-layer-paint: #ffffff;
        --melee3-rim-glow-layer-width: 82px;
        --melee3-rim-glow-layer-opacity: 1;
        --melee3-rim-glow-layer-dx: 0px;
        --melee3-rim-glow-layer-dy: 0px;
        --melee3-rim-dark-underlay-paint: #050505;
        --melee3-rim-dark-underlay-width: 88px;
        --melee3-rim-dark-underlay-opacity: 0.94;
        --melee3-rim-dark-underlay-dx: 0px;
