        --melee3-outer-depth-layer-width: 92px;
        --melee3-outer-depth-layer-opacity: 1;
        --melee3-outer-depth-layer-dx: 0px;
        --melee3-outer-depth-layer-dy: 0px;
        --melee3-rim-glow-layer-paint: #ffffff;
        --melee3-rim-glow-layer-width: 82px;
        --melee3-rim-glow-layer-opacity: 1;
        --melee3-rim-glow-layer-dx: 0px;
