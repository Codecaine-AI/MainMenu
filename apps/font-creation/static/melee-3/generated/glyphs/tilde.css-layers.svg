        --melee3-rim-left-plate-opacity: 0.74;
        --melee3-rim-left-plate-dx: -9px;
        --melee3-rim-left-plate-dy: 7px;
        --melee3-rim-right-plate-paint: #20262c;
        --melee3-rim-right-plate-width: 96px;
        --melee3-rim-right-plate-opacity: 0.62;
        --melee3-rim-right-plate-dx: 16px;
        --melee3-rim-right-plate-dy: -11px;
        --melee3-silver-rim-layer-paint: url(#silver-gradient);
        --melee3-silver-rim-layer-width: 72px;
        --melee3-silver-rim-layer-opacity: 1;
        --melee3-silver-rim-layer-dx: 0px;
        --melee3-silver-rim-layer-dy: 0px;
        --melee3-fill-layer-paint: url(#red-fill-gradient);
        --melee3-fill-layer-opacity: 1;
        --melee3-red-gloss-layer-paint: url(#red-gloss-gradient);
        --melee3-red-gloss-layer-opacity: 0.3;
        --melee3-red-gloss-layer-height-ratio: 0.58;
        --melee3-edge-highlight-layer-paint: #ffffff;
        --melee3-edge-highlight-layer-width: 22px;
        --melee3-edge-highlight-layer-opacity: 0.72;
        --melee3-edge-highlight-layer-dx: 0px;
        --melee3-edge-highlight-layer-dy: 0px;
        --melee3-inner-highlight-layer-paint: #ffffff;
        --melee3-inner-highlight-layer-width: 16px;
        --melee3-inner-highlight-layer-opacity: 0.95;
        --melee3-inner-highlight-layer-dx: 0px;
        --melee3-inner-highlight-layer-dy: 0px;
        --melee3-inner-shadow-layer-paint: #1c1c1c;
        --melee3-inner-shadow-layer-width: 10px;
        --melee3-inner-shadow-layer-opacity: 0.58;
        --melee3-inner-shadow-layer-dx: 0px;
        --melee3-inner-shadow-layer-dy: 0px;
      }
      
      g[data-layer] { transform-box: fill-box; transform-origin: center; }
      #shadow-layer { opacity: var(--melee3-shadow-layer-opacity, 1); transform: translate(var(--melee3-shadow-layer-dx, 0px), var(--melee3-shadow-layer-dy, 0px)); }
      #shadow-layer use { stroke: var(--melee3-shadow-layer-paint); stroke-width: var(--melee3-shadow-layer-width); }
      #outer-depth-layer { opacity: var(--melee3-outer-depth-layer-opacity, 1); transform: translate(var(--melee3-outer-depth-layer-dx, 0px), var(--melee3-outer-depth-layer-dy, 0px)); }
      #outer-depth-layer use { stroke: var(--melee3-outer-depth-layer-paint); stroke-width: var(--melee3-outer-depth-layer-width); }
      #rim-glow-layer { opacity: var(--melee3-rim-glow-layer-opacity, 1); transform: translate(var(--melee3-rim-glow-layer-dx, 0px), var(--melee3-rim-glow-layer-dy, 0px)); }
      #rim-glow-layer use { stroke: var(--melee3-rim-glow-layer-paint); stroke-width: var(--melee3-rim-glow-layer-width); }
      #rim-dark-underlay { opacity: var(--melee3-rim-dark-underlay-opacity, 1); transform: translate(var(--melee3-rim-dark-underlay-dx, 0px), var(--melee3-rim-dark-underlay-dy, 0px)); }
      #rim-dark-underlay use { stroke: var(--melee3-rim-dark-underlay-paint); stroke-width: var(--melee3-rim-dark-underlay-width); }
      #rim-left-plate { opacity: var(--melee3-rim-left-plate-opacity, 1); transform: translate(var(--melee3-rim-left-plate-dx, 0px), var(--melee3-rim-left-plate-dy, 0px)); }
      #rim-left-plate use { stroke: var(--melee3-rim-left-plate-paint); stroke-width: var(--melee3-rim-left-plate-width); }
      #rim-right-plate { opacity: var(--melee3-rim-right-plate-opacity, 1); transform: translate(var(--melee3-rim-right-plate-dx, 0px), var(--melee3-rim-right-plate-dy, 0px)); }
      #rim-right-plate use { stroke: var(--melee3-rim-right-plate-paint); stroke-width: var(--melee3-rim-right-plate-width); }
      #silver-rim-layer { opacity: var(--melee3-silver-rim-layer-opacity, 1); transform: translate(var(--melee3-silver-rim-layer-dx, 0px), var(--melee3-silver-rim-layer-dy, 0px)); }
      #silver-rim-layer use { stroke: var(--melee3-silver-rim-layer-paint); stroke-width: var(--melee3-silver-rim-layer-width); }
      #fill-layer { opacity: var(--melee3-fill-layer-opacity, 1); transform: translate(var(--melee3-fill-layer-dx, 0px), var(--melee3-fill-layer-dy, 0px)); }
      #red-gloss-layer { opacity: var(--melee3-red-gloss-layer-opacity, 1); transform: translate(var(--melee3-red-gloss-layer-dx, 0px), var(--melee3-red-gloss-layer-dy, 0px)); }
      #edge-highlight-layer { opacity: var(--melee3-edge-highlight-layer-opacity, 1); transform: translate(var(--melee3-edge-highlight-layer-dx, 0px), var(--melee3-edge-highlight-layer-dy, 0px)); }
      #edge-highlight-layer use { stroke: var(--melee3-edge-highlight-layer-paint); stroke-width: var(--melee3-edge-highlight-layer-width); }
      #inner-highlight-layer { opacity: var(--melee3-inner-highlight-layer-opacity, 1); transform: translate(var(--melee3-inner-highlight-layer-dx, 0px), var(--melee3-inner-highlight-layer-dy, 0px)); }
      #inner-highlight-layer use { stroke: var(--melee3-inner-highlight-layer-paint); stroke-width: var(--melee3-inner-highlight-layer-width); }
      #inner-shadow-layer { opacity: var(--melee3-inner-shadow-layer-opacity, 1); transform: translate(var(--melee3-inner-shadow-layer-dx, 0px), var(--melee3-inner-shadow-layer-dy, 0px)); }
      #inner-shadow-layer use { stroke: var(--melee3-inner-shadow-layer-paint); stroke-width: var(--melee3-inner-shadow-layer-width); }
  </style>

