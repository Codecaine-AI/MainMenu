<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Font Layer App</title>
  </head>
  <body>
    <main class="lab-shell">
      <section class="workbench" aria-label="MELEE 3 layer preview">
        <div class="scene" id="scene">
          <div class="stage-background" aria-hidden="true"></div>
          <div class="stage-tilt" id="stageTilt">
            <div class="logo-mount" id="svgMount" aria-live="polite">
              <div class="load-state">Loading MELEE 3 asset</div>
            </div>
          </div>
        </div>
      </section>

      <aside class="control-panel" aria-label="Layer controls">
        <header class="panel-header">
          <h1>Font layer app</h1>

          <div class="control-group header-asset-picker">
            <label for="assetSelect">Asset</label>
            <select id="assetSelect">
              <option value="/generation/outputs/generated/word/CODECAINE.css-layers.svg">CODECAINE</option>
              <option value="/generation/outputs/generated/glyphs/at.css-layers.svg" selected>@</option>
              <option value="/generation/outputs/generated/glyphs/A.css-layers.svg">A</option>
              <option value="/generation/outputs/generated/glyphs/R.css-layers.svg">R</option>
              <option value="/generation/outputs/generated/glyphs/F.css-layers.svg">F</option>
              <option value="/generation/outputs/generated/glyphs/K.css-layers.svg">K</option>
              <option value="/generation/outputs/generated/glyphs/asterisk.css-layers.svg">*</option>
            </select>
          </div>
        </header>

        <div class="editor-tabs">
          <div class="editor-tab-list" role="tablist" aria-label="Editor sections">
            <button type="button" class="tab-button is-active" id="layerEditorTab" role="tab" aria-selected="true" aria-controls="layerEditorPanel" data-editor-tab="layers">Layers</button>
            <button type="button" class="tab-button" id="mediaEditorTab" role="tab" aria-selected="false" aria-controls="mediaEditorPanel" data-editor-tab="media">Media</button>
            <button type="button" class="tab-button" id="lightingEditorTab" role="tab" aria-selected="false" aria-controls="lightingEditorPanel" data-editor-tab="lighting">Lighting</button>
            <button type="button" class="tab-button" id="styleEditorTab" role="tab" aria-selected="false" aria-controls="styleEditorPanel" data-editor-tab="style">Styling</button>
            <button type="button" class="tab-button" id="actionsEditorTab" role="tab" aria-selected="false" aria-controls="actionsEditorPanel" data-editor-tab="actions">Actions</button>
          </div>

          <section class="tab-panel is-active" id="layerEditorPanel" role="tabpanel" aria-labelledby="layerEditorTab" data-editor-panel="layers">
            <section class="layer-visualizer" aria-label="SVG layer stack">
              <div class="layer-visualizer-header">
                <h2>Layer Stack</h2>
                <button type="button" id="regenerateButton" disabled>Save</button>
              </div>
              <p>Shown inside out. This is the layer map, not SVG paint order.</p>
              <div class="layer-stack-map" id="layerStackMap"></div>
            </section>
          </section>

          <section class="tab-panel" id="mediaEditorPanel" role="tabpanel" aria-labelledby="mediaEditorTab" data-editor-panel="media" hidden>
            <section class="media-editor" aria-label="Video media controls">
              <div class="media-editor-header">
                <h2>Video Media</h2>
                <button type="button" id="mediaSaveButton" disabled>Save</button>
              </div>
              <div class="media-control-list" id="mediaControlList"></div>
            </section>
          </section>

          <section class="tab-panel" id="lightingEditorPanel" role="tabpanel" aria-labelledby="lightingEditorTab" data-editor-panel="lighting" hidden>
            <section class="lighting-editor" aria-label="Lighting controls">
              <div class="lighting-editor-header">
                <h2>Lighting</h2>
                <button type="button" id="lightingSaveButton" disabled>Save</button>
              </div>
              <div class="lighting-control-list" id="lightingControlList"></div>
            </section>
          </section>

          <section class="tab-panel" id="styleEditorPanel" role="tabpanel" aria-labelledby="styleEditorTab" data-editor-panel="style" hidden>
            <section class="style-editor" aria-label="CSS styling controls">
              <h2>Styling</h2>

              <section class="style-section" aria-label="Global preview controls">
                <h3>Global Preview</h3>
                <div class="control-grid compact-grid">
                  <label>
                    <span>Contrast</span>
                    <span class="style-control-pair">
                      <input type="number" min="0.75" max="1.45" value="1.12" step="0.01" aria-label="Contrast value" data-style-var="contrast" />
                    </span>
                  </label>
                  <label>
                    <span>Stage</span>
                    <input type="color" value="#858384" data-style-var="stage-color" />
                  </label>
                </div>
              </section>

              <section class="style-section" aria-label="Tilt response controls">
                <h3>Tilt Response</h3>
                <div class="control-grid compact-grid">
                  <label class="tilt-toggle-label">
                    <span>Enabled</span>
                    <input type="checkbox" id="tiltResponseToggle" checked />
                  </label>
                  <label>
                    <span>Intensity</span>
                    <input type="range" min="0" max="2" step="0.1" value="1" id="tiltResponseIntensity" aria-label="Tilt response intensity" />
                  </label>
                </div>
              </section>
            </section>
          </section>

          <section class="tab-panel" id="actionsEditorPanel" role="tabpanel" aria-labelledby="actionsEditorTab" data-editor-panel="actions" hidden>
            <section class="actions-editor" aria-label="Render actions">
              <h2>Actions</h2>
              <div class="button-row">
                <button type="button" id="fullRegenerateButton">Full Regenerate (all glyphs)</button>
                <button type="button" id="resetTiltButton">Reset Tilt</button>
                <button type="button" id="copyButton">Copy CSS</button>
              </div>
              <div class="button-row" style="margin-top: 0.5rem">
                <button type="button" id="bakeButton">Bake SVG</button>
                <label style="display:inline-flex; align-items:center; gap:0.25rem; font-size:0.8rem">
                  <span>Scale</span>
                  <select id="bakeScale">
                    <option value="1">1x</option>
                    <option value="2" selected>2x</option>
                    <option value="3">3x</option>
                  </select>
                </label>
              </div>
              <p class="app-status" id="appStatus" role="status" aria-live="polite"></p>
            </section>
          </section>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
