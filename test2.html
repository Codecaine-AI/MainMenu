<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melee Menu</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; background: #0a0e24; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(24px, 6vw, 80px);
      gap: 6px;
    }

    .menu-btn {
      --body: #0c122d;
      --border: #b58c32;
      --hi-top: #ebc04e;
      --sh-bot: #6a4b07;
      --hi-edge: #84611a;

      position: relative;
      display: block;
      width: min(700px, calc(100vw - 48px));
      aspect-ratio: 2048 / 365;
      padding: 0;
      border: 0;
      background: transparent;
      appearance: none;
      cursor: pointer;
      filter:
        drop-shadow(0 0 1.5px rgba(140, 110, 40, 0.25))
        drop-shadow(0 0 4px  rgba(140, 110, 40, 0.1));
      transition: filter 0.15s ease;
    }

    .menu-btn svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .menu-btn.selected {
      --body: #162050;
      --border: #d4a817;
      --hi-top: #f5d45a;
      --sh-bot: #8a6010;
      --hi-edge: #a07820;
      filter:
        drop-shadow(0 0 3px  rgba(212, 168, 23, 0.9))
        drop-shadow(0 0 8px  rgba(212, 168, 23, 0.6))
        drop-shadow(0 0 18px rgba(212, 168, 23, 0.35))
        drop-shadow(0 0 40px rgba(180, 140, 20, 0.2));
    }

    .menu-btn:hover:not(.selected) {
      --body: #141a40;
      --border: #c4a030;
      filter:
        drop-shadow(0 0 2px rgba(180, 140, 50, 0.4))
        drop-shadow(0 0 6px rgba(180, 140, 50, 0.15));
    }

    .btn-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding-left: 11%;
      padding-right: 18%;
      font-family: "Arial Black", Impact, sans-serif;
      font-size: clamp(16px, 3.8vw, 40px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: -1.2px;
      color: #fff;
      text-shadow:
        -1.5px -1.5px 0 #060912,
         1.5px -1.5px 0 #060912,
        -1.5px  1.5px 0 #060912,
         1.5px  1.5px 0 #060912;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
